version: '3.8'

networks:
  backend-net:
    driver: bridge
  frontend-net:
    driver: bridge

volumes:
  postgres_data:
  jupyter_data:

services:
  web-server:
    image: nginx:alpine
    container_name: nginx-server
    ports:
      - "${NGINX_PORT}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/index.html:/usr/share/nginx/html/index.html
    networks:
      - frontend-net

  node-app:
    build: ./node-app
    container_name: node-api-app
    ports:
      - "${NODE_PORT}:${NODE_PORT}"
    environment:
      - PORT=${NODE_PORT}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    depends_on:
      - postgres-db
    networks:
      - frontend-net
      - backend-net

  postgres-db:
    image: postgres:16-alpine
    container_name: postgres-database
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend-net

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-dashboard
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "${PGADMIN_PORT}:80"
    depends_on:
      - postgres-db
    networks:
      - backend-net
      - frontend-net

  jupyter:
    image: jupyter/base-notebook:latest
    container_name: jupyter-lab
    ports:
      - "${JUPYTER_PORT}:8888"
    volumes:
      - jupyter_data:/home/jovyan/work
    environment:
      JUPYTER_TOKEN: "docker2026"
    networks:
      - frontend-net
